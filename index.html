:root{
  --grass-700:#166534;
  --grass-600:#16a34a;
  --grass-100:#dcfce7;
  --gold-500:#ca8a04;
  --ink-900:#111827;
  --ink-500:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#fff;
  font-family:"DM Sans",system-ui,-apple-system,sans-serif;
  color:var(--ink-900);
  min-height:100vh;
}
#root{position:relative;z-index:1;}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
input[type=number]{-moz-appearance:textfield;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:999px;}
.inp:focus{border-color:var(--grass-600)!important;box-shadow:0 0 0 3px rgba(22,163,74,.12);outline:none;}
.score-inp:focus{border-color:var(--grass-600)!important;box-shadow:0 0 0 3px rgba(22,163,74,.14);outline:none;}
.btn-acc{transition:transform .12s ease,box-shadow .2s ease,filter .2s ease;}
.btn-acc:hover{filter:brightness(.98);box-shadow:0 6px 16px rgba(22,163,74,.22);}
.btn-acc:active{transform:translateY(1px);}
.pill{transition:all .18s;cursor:pointer;}
summary{list-style:none;}
summary::-webkit-details-marker{display:none;}
summary:hover{filter:brightness(.995);}
.match-card{
  border:1px solid rgba(17,24,39,.08)!important;
  animation:cardIn .32s ease both;
  position:relative;
  isolation:isolate;
  background:
    radial-gradient(260px 120px at 50% -30%,rgba(22,163,74,.12),transparent 72%),
    linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.94))!important;
}
.match-card:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(90deg,transparent 0 48%,rgba(22,163,74,.08) 48% 52%,transparent 52%),
    radial-gradient(circle at 50% 50%,transparent 0 46px,rgba(22,163,74,.08) 47px 48px,transparent 49px);
  opacity:.5;
  z-index:0;
}
.match-card>*{position:relative;z-index:1;}
.match-card:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(17,24,39,.12)!important;}
select{cursor:pointer;}
.login-grid{grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr);}
.login-hero{min-height:480px;}
.login-hero,.home-hero,.join-hero{ isolation:isolate; }
.login-hero:after,.home-hero:after,.join-hero:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(115deg,rgba(255,255,255,.12),rgba(255,255,255,0) 38%),
    radial-gradient(circle at 74% 22%,rgba(255,255,255,.16),rgba(255,255,255,0) 28%),
    linear-gradient(90deg,transparent 0 49.4%,rgba(255,255,255,.10) 49.4% 50.6%,transparent 50.6%);
  opacity:.8;
  z-index:0;
}
.login-hero>*,.home-hero>*,.join-hero>*{position:relative;z-index:1;}
.login-score-grid,.info-grid{grid-template-columns:repeat(3,1fr);}
.join-grid{grid-template-columns:minmax(0,.9fr) minmax(300px,1fr);}
.lux-card{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  box-shadow:0 12px 34px rgba(17,24,39,.08),0 1px 2px rgba(17,24,39,.04)!important;
}
.lux-card:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(240px 120px at 14% -20%,rgba(22,163,74,.12),transparent 70%),
    radial-gradient(260px 150px at 110% 20%,rgba(234,179,8,.12),transparent 64%),
    linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0));
  z-index:0;
}
.lux-card>*{position:relative;z-index:1;}
.topbar-premium{
  background:#fff!important;
  border-bottom:1px solid rgba(17,24,39,.08)!important;
  box-shadow:none!important;
}
.bottom-nav-premium button{
  transition:transform .18s ease,color .18s ease,background .18s ease;
}
.bottom-nav-premium button:hover{
  background:rgba(22,163,74,.045)!important;
  transform:translateY(-1px);
}
.btn-acc,.pill,summary,button{ -webkit-tap-highlight-color:transparent; }
.mini-tile{ position:relative; overflow:hidden; }
.mini-tile:after{
  content:"";
  position:absolute;
  inset:auto -18px -24px auto;
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.35);
}
.brand-chip{ box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 8px 22px rgba(0,0,0,.10); }
@keyframes cardIn{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:translateY(0);}
}
@media (max-width:820px){ .login-grid,.join-grid{grid-template-columns:1fr!important;} .login-hero{min-height:auto!important;} }
@media (max-width:620px){ .login-score-grid,.info-grid{grid-template-columns:1fr!important;} }
@media (max-width:480px){ .match-card{animation:none;} }
</style>

// Helper para extrair string de data ISO (YYYY-MM-DD) baseado no fuso de SP
const getSPDayString = dtStr => {
  return new Intl.DateTimeFormat('fr-CA', {timeZone: 'America/Sao_Paulo', year: 'numeric', month: '2-digit', day: '2-digit'}).format(new Date(dtStr));
};

function calcPts(pred,result){
  if(!result||result.home===''||result.home===undefined) return null;
  const ph=+pred.home,pa=+pred.away,rh=+result.home,ra=+result.away;
  if(isNaN(ph)||isNaN(pa)) return null;
  const predOutcome=ph>pa?'H':ph<pa?'A':'D';
  const realOutcome=rh>ra?'H':rh<ra?'A':'D';
  const oneScore=ph===rh||pa===ra;
  if(ph===rh&&pa===ra) return 7;
  if(predOutcome===realOutcome&&oneScore) return 4;
  if(predOutcome===realOutcome) return 3;
  if(oneScore) return 1;
  return 0;
}
const fDate=dt=>new Date(dt).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
const fTime=dt=>new Date(dt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});
const started=dt=>new Date(dt).getTime()<=Date.now();

  const [pi,setPi]=useState({});

  // Mapeamento dinâmico para encontrar o primeiro horário de jogo de cada dia
  const firstMatchOfEachDay = useMemo(() => {
    const map = {};
    matches.forEach(m => {
      const dayKey = getSPDayString(m.dt);
      const mTime = new Date(m.dt).getTime();
      if (!map[dayKey] || mTime < map[dayKey]) {
        map[dayKey] = mTime;
      }
    });
    return map;
  }, [matches]);

  // Lógica corrigida: Libera com base no primeiro jogo daquele dia específico
  const predictionOpen = m => {
    const dayKey = getSPDayString(m.dt);
    const baseTime = firstMatchOfEachDay[dayKey] || new Date(m.dt).getTime();
    return Date.now() >= (baseTime - PREDICTION_OPEN_MS);
  };

  const unlockLabel = m => {
    const dayKey = getSPDayString(m.dt);
    const baseTime = firstMatchOfEachDay[dayKey] || new Date(m.dt).getTime();
    const unlockTs = baseTime - PREDICTION_OPEN_MS;
    return `${new Date(unlockTs).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',timeZone:'America/Sao_Paulo'})} às ${new Date(unlockTs).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'})}`;
  };

  const matchLocked = m => started(m?.dt);
  const canEditMatch = m => m && predictionOpen(m) && !matchLocked(m);

  useEffect(()=>{
    const savedName = localStorage.getItem(NAME_STORAGE_KEY) || '';
    const authUnsub = auth.onAuthStateChanged(user=>{
      if(user){
        setMe(user.uid);
        setMeEmail(user.email || '');
        setNameInput(savedName.slice(0,24));
        setBoot(true);
      }else{
        setMe(''); setMeName(''); setBoot(false);
      }
      setAuthReady(true);
    });
    return ()=>authUnsub && authUnsub();
  },[]);

  useEffect(()=>{
    if(!authReady||!me) return;
    let live=true;

    ref('matches').once('value').then(snap=>{
      if(!snap.val() && live){
        const obj={}; BASE_MATCHES.forEach(m=>{obj[m.id]=m;});
        ref('matches').set(obj);
      }
    });

    const mRef = ref('matches');
    const pRef = ref('predictions');
    const partsRef = ref('participants');
    const adminsRef = ref('admins');

    mRef.on('value', snap=>{
      if(!live) return;
      const arr = Object.values(snap.val()||{}).sort((a,b)=>new Date(a.dt)-new Date(b.dt));
      setMatches(arr);
      const riInit={}; arr.forEach(m=>{riInit[m.id]=m.result||{home:'',away:''};});
      setRi(riInit);
      setBoot(false);
    });

    pRef.on('value', snap=>{ if(live) setPreds(snap.val()||{}); });
    adminsRef.on('value', snap=>{ if(live) setAdminIds(snap.val()||{}); });
    partsRef.on('value', snap=>{
      if(!live) return;
      const val=snap.val()||{}; const ids=[]; const meta={};
      Object.entries(val).forEach(([uid,item])=>{
        ids.push(uid); meta[uid]={name:item.name,email:item.email||''};
      });
      setParts(ids); setPartMeta(meta);
    });

    return ()=>{ live=false; mRef.off(); pRef.off(); partsRef.off(); adminsRef.off(); };
  },[authReady, me]);

  useEffect(()=>{
    if(!me||matches.length===0) return;
    const piInit={};
    matches.forEach(m=>{piInit[m.id]=(preds[me]||{})[m.id]||{home:'',away:''};});
    setPi(piInit);

  useEffect(()=>{

  const join=async()=>{

  const logout=()=>{ auth.signOut(); localStorage.clear(); };

    const m=matches.find(x=>x.id===id);
    if(!canEditMatch(m)){ showToast('Palpite fechado ou não liberado.',false); return; }
    const p=pi[id]||{home:'',away:''};

    setSaving(id);
    await ref(`predictions/${me}/${id}`).set({home:parseInt(p.home),away:parseInt(p.away)});
    showToast('Palpite salvo!');
    setSaving(null);
  };

  // Computados dinâmicos e corretos para a interface baseados em canEditMatch
  const openGroupMatchesNow = matches.filter(m=>m.ph==='Grupos' && canEditMatch(m));
  const openKnockoutMatchesNow = matches.filter(m=>m.ph!=='Grupos' && canEditMatch(m));

        const p=(preds[uid]||{})[m.id]; if(!p) return;

        total++; pts+=x; if(x===7) exact++; else if(x>=3) win++;

      return {uid, name:getName(uid), pts, exact, win, total};

    const groups=[]; const index={};

        groups.push(index[key]);

      index[key].matches.push(m);
    });
    return groups;
  };

                <div>
                  <input type="number" style={{width:30}} placeholder="H" value={ri[m.id]?.home||''} onChange={e=>setRi(r=>({...r,[m.id]:{...r[m.id],home:e.target.value}}))}/>
                  <input type="number" style={{width:30}} placeholder="A" value={ri[m.id]?.away||''} onChange={e=>setRi(r=>({...r,[m.id]:{...r[m.id],away:e.target.value}}))}/>
                  <button onClick={async()=>{
                    await ref(`matches/${m.id}/result`).set({home:parseInt(ri[m.id].home),away:parseInt(ri[m.id].away)});
                    showToast('Placar oficial salvo!');
                  }}>OK</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Bolao/>);
</script>
</body>
</html>
